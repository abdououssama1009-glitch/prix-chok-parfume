<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIX CHOC PARFUM - متجر العطور الفاخرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-pink: #f7a8b8;
            --rose-accent: #e88299;
            --black: #0d0d0d;
            --dark-card: #171717;
            --white: #ffffff;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0b0b; color: var(--white); padding-bottom: 80px; overflow-x: hidden; }

        header {
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(247, 168, 184, 0.2);
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary-pink); object-fit: cover; box-shadow: 0 0 10px rgba(247, 168, 184, 0.4); }
        .brand-title { font-size: 1.2rem; font-weight: 800; background: linear-gradient(45deg, var(--white), var(--primary-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .cart-icon-wrapper { position: relative; cursor: pointer; padding: 5px; }
        .cart-badge { position: absolute; top: -5px; right: -8px; background: var(--primary-pink); color: var(--black); font-size: 0.75rem; font-weight: 900; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

        .hero {
            padding: 30px 20px 20px; text-align: center;
            background: radial-gradient(circle at center, rgba(247, 168, 184, 0.12) 0%, rgba(11, 11, 11, 1) 70%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .hero-badge { display: inline-block; background: rgba(247, 168, 184, 0.15); color: var(--primary-pink); padding: 4px 15px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; margin-bottom: 10px; border: 1px solid rgba(247, 168, 184, 0.3); }
        .hero h1 { font-size: 1.7rem; font-weight: 900; margin-bottom: 8px; }
        .hero h1 span { color: var(--primary-pink); }
        .hero p { color: #aaa; font-size: 0.85rem; }

        .filter-section { display: flex; justify-content: center; gap: 8px; padding: 15px; overflow-x: auto; }
        .filter-btn { background: #1c1c1c; color: #ccc; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.3s; }
        .filter-btn.active { background: var(--primary-pink); color: var(--black); border-color: var(--primary-pink); }

        .section-header { padding: 10px 15px 10px; }
        .section-title { font-size: 1.2rem; font-weight: 800; border-right: 4px solid var(--primary-pink); padding-right: 10px; }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px; }
        @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 0 40px; } }

        .product-card { background: var(--dark-card); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; position: relative; }
        .gender-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); color: var(--primary-pink); font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 10px; z-index: 2; border: 1px solid rgba(247, 168, 184, 0.3); }
        .img-container { width: 100%; padding-top: 100%; position: relative; background: #202020; }
        .product-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .product-details { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; height: 2.4em; overflow: hidden; }
        .price-tag { font-size: 1.1rem; font-weight: 900; color: var(--primary-pink); margin-bottom: 10px; }
        .price-tag span { font-size: 0.75rem; color: #aaa; }

        .order-btn { background: var(--white); color: var(--black); border: none; padding: 8px; border-radius: var(--radius-md); font-weight: 800; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
        .order-btn:active { transform: scale(0.95); background: var(--primary-pink); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-end; z-index: 2000; }
        @media (min-width: 768px) { .modal-overlay { align-items: center; } }
        .modal-card { background: #171717; width: 100%; max-width: 450px; border-radius: 25px 25px 0 0; padding: 25px 20px; border-top: 2px solid var(--primary-pink); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #ddd; }
        .form-group input { width: 100%; padding: 12px; background: #222; border: 1px solid #333; border-radius: var(--radius-md); color: white; font-size: 0.9rem; outline: none; }
        .btn-primary { background: linear-gradient(45deg, var(--primary-pink), var(--rose-accent)); color: var(--black); border: none; padding: 12px; border-radius: var(--radius-md); font-weight: 800; width: 100%; cursor: pointer; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <!-- اللوقو الخاص بك -->
            <img src="logo.pnj/799486822_1424005629793854_5673149828438747227_n.jpg" alt="PRIX CHOC PARFUM" class="logo-img" onerror="this.src='https://via.placeholder.com/100/f7a8b8/111111?text=PCP'">
            <span class="brand-title">PRIX CHOC PARFUM</span>
        </div>
        <!-- أيقونة السلة في الهيدر -->
        <div class="cart-icon-wrapper" onclick="toggleCartModal()">
            <i class="fa-solid fa-bag-shopping" style="font-size: 1.4rem; color: var(--primary-pink);"></i>
            <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <section class="hero">
        <span class="hero-badge"><i class="fa-solid fa-truck-fast"></i> التوصيل سريع لـ 69 ولاية</span>
        <h1>عطورك المفضلة <br><span>بأسعار صدمة!</span></h1>
        <p>الدفع عند الاستلام بعد معاينة المنتج</p>
    </section>

    <div class="filter-section">
        <button class="filter-btn active" onclick="filterCategory('all', this)">الكل ✨</button>
        <button class="filter-btn" onclick="filterCategory('men', this)">رجالي ♂</button>
        <button class="filter-btn" onclick="filterCategory('women', this)">نسائي ♀</button>
        <button class="filter-btn" onclick="filterCategory('unisex', this)">للجنسين 💎</button>
    </div>

    <main>
        <div class="section-header">
            <h2 class="section-title">التشكيلة المتاحة 🔥</h2>
        </div>
        <div class="products-grid" id="productsGrid">
            <div style="grid-column: 1/-1; text-align:center; color:#aaa; padding:30px;">جاري تحميل العطور...</div>
        </div>
    </main>

    <!-- نافذة السلة وتأكيد الطلب -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="color: var(--primary-pink);"><i class="fa-solid fa-cart-shopping"></i> سلة المشتريات</h3>
                <button class="close-btn" onclick="toggleCartModal()">&times;</button>
            </div>
            
            <div id="cartItemsList" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto;"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-top: 1px solid #333; padding-top: 10px;">
                <span>المجموع الكلي:</span>
                <span style="font-size: 1.2rem; font-weight: 900; color: var(--primary-pink);"><span id="cartTotalAmount">0</span> د.ج</span>
            </div>

            <form id="orderForm">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="custName" placeholder="اسمك واللقب" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="custPhone" placeholder="06 / 07 / 05 XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>الولاية</label>
                    <input type="text" id="custState" placeholder="اكتب ولايتك" required>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;">تأكيد وإرسال الطلب 🛍️</button>
            </form>
        </div>
    </div>

    <script>
        // إعدادات Supabase
        const SUPABASE_URL = "https://abqhmoohlcinzsxskdqa.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_v6y_D0RlGEXeoVf7zBdsWw_PQrS28yI"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let cart = [];
        let currentFilter = 'all';

        async function fetchProducts() {
            const { data, error } = await _supabase.from('products').select('*');
            if (error) {
                console.error("خطأ في جلب العطور:", error);
                document.getElementById('productsGrid').innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#e74c3c; padding:30px;">فشل في تحميل العطور، يرجى التنسيق مع Supabase</div>`;
            } else {
                products = data || [];
                renderProducts();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            const filteredProducts = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#666; padding:30px;">لا توجد عطور متوفرة في هذا القسم حالياً</div>`;
                return;
            }

            filteredProducts.forEach(product => {
                let genderText = "للجنسين ✨";
                if(product.category === 'men') genderText = "رجالي ♂";
                if(product.category === 'women') genderText = "نسائي ♀";

                grid.innerHTML += `
                    <div class="product-card">
                        <span class="gender-tag">${genderText}</span>
                        <div class="img-container"><img src="${product.image}" class="product-img"></div>
                        <div class="product-details">
                            <div class="product-name">${product.name}</div>
                            <div class="price-tag">${product.price} <span>د.ج</span></div>
                            <button class="order-btn" onclick="addToCart('${product.id}', '${product.name}', '${product.price}')">
                                <i class="fa-solid fa-cart-plus"></i> أضف إلى السلة
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        // إدارة السلة
        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id, name, price: parseFloat(price), quantity: 1 });
            }
            updateCartUI();
            alert(`تمت إضافة "${name}" إلى السلة! 🛍️`);
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').innerText = totalCount;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                renderCartItems();
                modal.style.display = 'flex';
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cartItemsList');
            const totalEl = document.getElementById('cartTotalAmount');
            
            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888; padding:15px;">السلة فارغة حالياً</p>`;
                totalEl.innerText = '0';
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:#222; padding:10px; border-radius:8px;">
                        <div>
                            <div style="font-weight:bold; font-size:0.85rem;">${item.name}</div>
                            <div style="color:var(--primary-pink); font-size:0.8rem;">${item.price} د.ج × ${item.quantity}</div>
                        </div>
                        <button onclick="removeFromCart('${item.id}')" style="background:none; border:none; color:#ff4d4d; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });

            totalEl.innerText = total;
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
            renderCartItems();
        }

        // إرسال الطلب إلى Supabase
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert("يرجى إضافة عطر واحد على الأقل إلى السلة قبل الطلب!");
                return;
            }

            const itemsSummary = cart.map(i => `${i.name} (x${i.quantity})`).join(', ');
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);

            const newOrder = {
                product_name: itemsSummary,
                product_price: totalPrice.toString(),
                cust_name: document.getElementById('custName').value,
                cust_phone: document.getElementById('custPhone').value,
                cust_state: document.getElementById('custState').value,
                status: 'pending'
            };

            const { error } = await _supabase.from('orders').insert([newOrder]);
            if (!error) {
                alert(`شكراً لك يا ${newOrder.cust_name}! تم تسجيل طلبك بنجاح وسنتصل بك قريباً.`);
                cart = [];
                updateCartUI();
                toggleCartModal();
                document.getElementById('orderForm').reset();
            } else {
                alert("حدث خطأ أثناء إرسال الطلب، الرجاء المحاولة لاحقاً.");
            }
        });

        fetchProducts();
    </script>
</body>
</html>
